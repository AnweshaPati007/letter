<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letter Preview</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #2b1d16;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      .container {
        position: relative;
        width: 90vw;
        max-width: 500px;
        aspect-ratio: 4 / 3;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      }

      .display-img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        transition:
          transform 0.25s ease,
          opacity 0.3s ease;
      }

      /* Subtle hover effect only while still interactive */
      .container.clickable:hover .display-img {
        transform: scale(1.02);
      }

      /* Final letter styling */
      .display-img.letter {
        cursor: default;
        border-radius: 4px;
        background-color: transparent;
      }

      /* Optional hint */
      .hint {
        position: absolute;
        bottom: -35px;
        font-size: 14px;
        color: #777;
        letter-spacing: 0.5px;
        transition: opacity 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div class="container clickable" id="stage">
      <img
        id="main-image"
        class="display-img"
        src="assets/images/envelope-closed.png"
        alt="Envelope"
      />
      <span class="hint" id="hint">Click to open</span>
    </div>

    <!-- Audio Element -->
    <audio id="open-audio" preload="auto" src="assets/audio/audio.mp3"></audio>

    <script>
      // --- Configuration ---
      const CONFIG = {
        // 1. Initial envelope cover image
        envelopeCover: "assets/images/envelope-closed.png",

        // 2. Flip-book / frame sequence images (ordered)
        sequenceFrames: [
          "assets/images/frame-1.png",
          "assets/images/frame-2.png",
          "assets/images/frame-3.png",
        ],

        // 3. Final revealed letter image
        finalLetter: "assets/images/letter.png",

        // Speed per frame in milliseconds
        frameIntervalMs: 500,

        audioDelayMs: 1000,
      };

      // --- DOM Elements ---
      const stage = document.getElementById("stage");
      const mainImage = document.getElementById("main-image");
      const openAudio = document.getElementById("open-audio");
      const hint = document.getElementById("hint");

      let hasOpened = false;

      // --- Preload Assets ---
      function preloadImages(urls) {
        urls.forEach((url) => {
          const img = new Image();
          img.src = url;
        });
      }

      // Preload sequence frames and final letter immediately on load
      preloadImages([...CONFIG.sequenceFrames, CONFIG.finalLetter]);

      // --- Sequence Player ---
      function playSequence() {
        let index = 0;

        const timer = setInterval(() => {
          if (index < CONFIG.sequenceFrames.length) {
            mainImage.src = CONFIG.sequenceFrames[index];
            index++;
          } else {
            clearInterval(timer);
            // Reveal the final letter
            mainImage.src = CONFIG.finalLetter;
            mainImage.classList.add("letter");
          }
        }, CONFIG.frameIntervalMs);
      }

      // --- Click Trigger ---
      stage.addEventListener("click", () => {
        if (hasOpened) return;
        hasOpened = true;

        // Update UI state
        stage.classList.remove("clickable");
        hint.style.opacity = "0";

        // Delayed audio playback
        setTimeout(() => {
          openAudio.currentTime = 0;
          openAudio.play().catch((err) => {
            console.warn("Audio play prevented or file not found:", err);
          });
        }, CONFIG.audioDelayMs);

        // Start the frame animation
        playSequence();
      });
    </script>
  </body>
</html>
